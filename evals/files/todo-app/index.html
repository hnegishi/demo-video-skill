<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Tasks</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; background: #f5f5f4; margin: 0; }
  main { max-width: 560px; margin: 48px auto; background: #fff; border-radius: 12px; padding: 24px 28px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin: 0 0 16px; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 8px 10px; font-size: 15px; border: 1px solid #d6d3d1; border-radius: 6px; }
  button { padding: 8px 14px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-size: 15px; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 16px 0 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid #f0efee; font-size: 15px; }
  li.done span { text-decoration: line-through; color: #a8a29e; }
  .filters { display: flex; gap: 6px; margin-top: 14px; }
  .filters button { background: #e7e5e4; color: #44403c; font-size: 13px; padding: 5px 10px; }
  .filters button.active { background: #44403c; color: #fff; }
  .count { margin-left: auto; color: #78716c; font-size: 13px; align-self: center; }
</style>
</head>
<body>
<main>
  <h1>今日のタスク</h1>
  <form id="f"><input id="title" type="text" placeholder="新しいタスク" autocomplete="off"><button type="submit">追加</button></form>
  <ul id="list"></ul>
  <div class="filters">
    <button data-f="all" class="active">すべて</button><button data-f="open">未完了</button><button data-f="done">完了</button>
    <span class="count" id="count"></span>
  </div>
</main>
<script>
  let items = [
    { title: '週次レポートを書く', done: false },
    { title: 'デザインレビューに出る', done: true },
    { title: '請求書を送る', done: false },
  ];
  let filter = 'all';
  const list = document.getElementById('list');
  function render() {
    list.innerHTML = '';
    items.filter(i => filter === 'all' || (filter === 'done') === i.done).forEach(i => {
      const li = document.createElement('li');
      li.className = i.done ? 'done' : '';
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = i.done;
      cb.onchange = () => { i.done = cb.checked; render(); };
      const span = document.createElement('span'); span.textContent = i.title;
      li.append(cb, span); list.append(li);
    });
    document.getElementById('count').textContent = `残り ${items.filter(i => !i.done).length} 件`;
  }
  document.getElementById('f').onsubmit = e => {
    e.preventDefault();
    const t = document.getElementById('title');
    if (t.value.trim()) items.push({ title: t.value.trim(), done: false });
    t.value = ''; render();
  };
  document.querySelectorAll('.filters button').forEach(b => b.onclick = () => {
    filter = b.dataset.f;
    document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('active', x === b));
    render();
  });
  render();
</script>
</body>
</html>
